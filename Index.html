<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Did You Love Me? 🐻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Pacifico&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', 'Comic Sans MS', cursive;
  background: #fff5f8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Animated gradient background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 20% 50%, #ffe4ef 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, #ffd6e8 0%, transparent 55%),
              radial-gradient(ellipse at 60% 80%, #ffe8f0 0%, transparent 50%),
              #fff5f8;
  z-index: 0;
}

/* Floating hearts */
.bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.bh {
  position: absolute;
  opacity: 0;
  animation: floatUp 6s ease-in infinite;
  font-style: normal;
}
@keyframes floatUp {
  0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: .6; }
  100% { transform: translateY(-110vh) rotate(30deg) scale(.6); opacity: 0; }
}

/* Card */
.card {
  position: relative;
  z-index: 10;
  background: #ffffff;
  border-radius: 36px;
  padding: 44px 52px 50px;
  max-width: 460px;
  width: 90vw;
  text-align: center;
  box-shadow: 0 8px 40px rgba(255,45,107,.14), 0 2px 8px rgba(255,45,107,.08);
  border: 2.5px solid #ffe4ef;
  animation: cardIn .75s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: scale(.6) translateY(50px); }
  to   { opacity:1; transform: scale(1)  translateY(0); }
}

/* Bear */
.bear-wrap { position: relative; display: inline-block; margin-bottom: 14px; }
.bear {
  font-size: 8rem;
  line-height: 1;
  display: block;
  animation: bearBounce 2.2s ease-in-out infinite;
  filter: drop-shadow(0 8px 18px rgba(255,107,157,.28));
  cursor: default;
  user-select: none;
}
@keyframes bearBounce {
  0%,100% { transform: translateY(0)    rotate(-4deg) scale(1); }
  50%      { transform: translateY(-12px) rotate(4deg)  scale(1.05); }
}
.blush {
  position: absolute;
  width: 24px; height: 13px;
  background: rgba(255,107,157,.42);
  border-radius: 50%;
  bottom: 28px;
  animation: bearBounce 2.2s ease-in-out infinite;
}
.blush.l { left:  42px; }
.blush.r { right: 42px; }

/* Text */
h1 {
  font-family: 'Pacifico', 'Comic Sans MS', cursive;
  font-size: 2.3rem;
  color: #ff2d6b;
  line-height: 1.2;
  margin-bottom: 6px;
  text-shadow: 0 2px 10px rgba(255,45,107,.18);
}
.sub {
  color: #c06;
  opacity: .55;
  font-size: .93rem;
  margin-bottom: 24px;
  font-weight: 700;
}
.tease {
  min-height: 24px;
  font-size: .9rem;
  color: #ff6b9d;
  font-weight: 800;
  margin-bottom: 14px;
  opacity: 0;
  transition: opacity .3s;
}
.tease.show { opacity: 1; }

/* Buttons */
.btns {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  position: relative;
  min-height: 58px;
}
.btn {
  padding: 15px 40px;
  border: none;
  border-radius: 50px;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  letter-spacing: .3px;
  white-space: nowrap;
}
.btn-yes {
  background: linear-gradient(135deg, #ff6b9d, #ff2d6b);
  color: #fff;
  box-shadow: 0 6px 22px rgba(255,45,107,.35);
}
.btn-yes:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(255,45,107,.45); }
.btn-no {
  background: #ffe4ef;
  color: #ff2d6b;
  box-shadow: 0 4px 12px rgba(255,107,157,.2);
}

/* Yes screen */
.yes-screen { display: none; }
.yes-screen.show {
  display: block;
  animation: popIn .65s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes popIn {
  from { opacity:0; transform:scale(.4) rotate(-5deg); }
  to   { opacity:1; transform:scale(1)  rotate(0); }
}
.big-emoji {
  font-size: 6rem;
  display: block;
  margin-bottom: 12px;
  animation: heartPop .6s cubic-bezier(.34,1.56,.64,1) both .1s;
}
@keyframes heartPop {
  from { transform: scale(0) rotate(-20deg); }
  to   { transform: scale(1) rotate(0); }
}
.yes-screen h2 {
  font-family: 'Pacifico', 'Comic Sans MS', cursive;
  font-size: 2rem;
  color: #ff2d6b;
  margin-bottom: 8px;
}
.yes-screen p { color: #5c1a33; opacity: .65; font-size: 1rem; line-height: 1.6; }

/* Confetti */
.conf {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  animation: cfFall linear forwards;
}
@keyframes cfFall {
  0%   { transform: translateY(-30px) rotate(0);    opacity: 1; }
  100% { transform: translateY(110vh)  rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="bg-hearts" id="bgH"></div>

<div class="card" id="card">
  <!-- Ask view -->
  <div id="askView">
    <div class="bear-wrap">
      <span class="bear">🐻</span>
      <span class="blush l"></span>
      <span class="blush r"></span>
    </div>
    <h1>Did You Love Me?</h1>
    <p class="sub">Be honest… the bear already knows 🐾</p>
    <div class="tease" id="tease"></div>
    <div class="btns" id="btnsArea">
      <button class="btn btn-yes" id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button class="btn btn-no"  id="noBtn"
        onmouseover="runAway(event)"
        ontouchstart="runAway(event)">No 🙈</button>
    </div>
  </div>

  <!-- Yes view -->
  <div class="yes-screen" id="yesView">
    <span class="big-emoji">💘</span>
    <h2>I Knew It! 🐻</h2>
    <p>The bear is doing a happy dance right now…<br>and so is my heart. 💕</p>
  </div>
</div>

<script>
/* ── Background hearts ── */
const hearts = ['💗','💓','💖','💝','💞','🩷','❤️','💟','🌸','✨'];
const bgH = document.getElementById('bgH');
for (let i = 0; i < 30; i++) {
  const s = document.createElement('span');
  s.className = 'bh';
  s.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  s.style.cssText = `
    left:${Math.random()*100}vw;
    bottom:-8vh;
    font-size:${.7+Math.random()*1.5}rem;
    animation-delay:${Math.random()*9}s;
    animation-duration:${4+Math.random()*5}s;
  `;
  bgH.appendChild(s);
}

/* ── No button runs away ── */
let noHits = 0;
const msgs = [
  "Come on… really? 🥺",
  "Are you sure?? 💔",
  "The bear is sobbing… 😢",
  "Liar liar! 🙈",
  "Last chance! 💕",
  "You can't fool the bear 🐻",
  "Ok but you DO though 😏",
  "Just admit it… 💘",
  "Resistance is futile 🌸",
];

function runAway(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  noHits++;
  const noBtn   = document.getElementById('noBtn');
  const area    = document.getElementById('btnsArea');
  const card    = document.getElementById('card');

  area.style.position = 'relative';
  area.style.minHeight = '130px';
  noBtn.style.position = 'absolute';

  const aW = area.offsetWidth;
  const aH = area.offsetHeight;
  const bW = noBtn.offsetWidth;
  const bH = noBtn.offsetHeight;

  const maxX = Math.max(aW - bW - 8, 0);
  const maxY = Math.max(aH - bH - 8, 0);
  const rx = Math.floor(Math.random() * maxX);
  const ry = Math.floor(Math.random() * maxY);

  noBtn.style.left = rx + 'px';
  noBtn.style.top  = ry + 'px';

  const tease = document.getElementById('tease');
  tease.textContent = msgs[Math.min(noHits - 1, msgs.length - 1)];
  tease.classList.add('show');

  // Grow yes button
  const scale = Math.min(1 + noHits * 0.08, 1.7);
  document.getElementById('yesBtn').style.transform = `scale(${scale})`;
}

/* ── Yes ── */
function sayYes() {
  document.getElementById('askView').style.display = 'none';
  document.getElementById('yesView').classList.add('show');
  launchConfetti();
}

/* ── Confetti ── */
const cols = ['#ff6b9d','#ff2d6b','#ffb3cc','#ff85a2','#fff','#ffe44d','#cc00ff','#55ddff'];
function launchConfetti() {
  for (let i = 0; i < 140; i++) {
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = 'conf';
      const sz = 6 + Math.random() * 10;
      d.style.cssText = `
        left:${Math.random()*100}vw;
        top:0;
        width:${sz}px; height:${sz}px;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        border-radius:${Math.random()>.5?'50%':'3px'};
        animation-duration:${1.8+Math.random()*2.5}s;
      `;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 5500);
    }, i * 16);
  }
}
</script>
</body>
</html>
