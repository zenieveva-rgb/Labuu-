<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Did You Love Me? 🐻</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink:    #ff6b9d;
    --rose:    #ff2d6b;
    --cream:   #fff5f8;
    --light:   #ffe4ef;
    --dark:    #5c1a33;
    --bear-bg: #ffccd8;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Floating hearts background ── */
  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bh {
    position: absolute;
    font-size: 1.4rem;
    opacity: 0;
    animation: floatUp 6s ease-in infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg);   opacity: .55; }
    100% { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
  }

  /* ── Card ── */
  .card {
    position: relative;
    z-index: 10;
    background: #fff;
    border-radius: 32px;
    padding: 44px 52px 48px;
    max-width: 460px;
    width: 90%;
    text-align: center;
    box-shadow:
      0 4px 24px rgba(255,45,107,.12),
      0 1px 4px  rgba(255,45,107,.08);
    border: 2.5px solid var(--light);
    animation: cardIn .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform: scale(.7) translateY(40px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }

  /* ── Bear ── */
  .bear-wrap {
    margin-bottom: 18px;
    position: relative;
    display: inline-block;
  }
  .bear {
    font-size: 7.5rem;
    line-height: 1;
    display: block;
    animation: bearBounce 2s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(255,107,157,.3));
    cursor: default;
    user-select: none;
  }
  @keyframes bearBounce {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }
  .bear-blush {
    position: absolute;
    width: 22px; height: 12px;
    background: rgba(255,107,157,.45);
    border-radius: 50%;
    bottom: 26px;
    animation: bearBounce 2s ease-in-out infinite;
  }
  .bear-blush.left  { left:  44px; }
  .bear-blush.right { right: 44px; }

  /* ── Headline ── */
  h1 {
    font-family: 'Pacifico', cursive;
    font-size: 2.2rem;
    color: var(--rose);
    line-height: 1.2;
    margin-bottom: 6px;
    text-shadow: 0 2px 8px rgba(255,45,107,.15);
  }
  .sub {
    color: #c06;
    opacity: .6;
    font-size: .95rem;
    margin-bottom: 28px;
  }

  /* ── Buttons ── */
  .btns {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    min-height: 56px;
  }
  .btn {
    padding: 14px 38px;
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    letter-spacing: .3px;
  }
  .btn-yes {
    background: linear-gradient(135deg, var(--pink), var(--rose));
    color: #fff;
    box-shadow: 0 6px 20px rgba(255,45,107,.35);
  }
  .btn-yes:hover {
    transform: scale(1.07);
    box-shadow: 0 8px 28px rgba(255,45,107,.45);
  }
  .btn-no {
    background: var(--light);
    color: var(--rose);
    box-shadow: 0 4px 12px rgba(255,107,157,.2);
    transition: all .15s;
  }
  /* no hover effect — JS moves it instead */

  /* ── Yes screen ── */
  .yes-screen {
    display: none;
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn {
    from { opacity:0; transform:scale(.5); }
    to   { opacity:1; transform:scale(1); }
  }
  .yes-screen .big-emoji {
    font-size: 5.5rem;
    display: block;
    animation: heartPop .5s cubic-bezier(.34,1.56,.64,1) both;
    margin-bottom: 10px;
  }
  @keyframes heartPop {
    from { transform: scale(0) rotate(-15deg); }
    to   { transform: scale(1) rotate(0); }
  }
  .yes-screen h2 {
    font-family: 'Pacifico', cursive;
    font-size: 1.9rem;
    color: var(--rose);
    margin-bottom: 6px;
  }
  .yes-screen p {
    color: var(--dark);
    opacity: .7;
    font-size: 1rem;
  }

  /* ── Confetti ── */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 999;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
    100% { transform: translateY(110vh)  rotate(720deg); opacity: 0; }
  }

  /* ── No counter message ── */
  .tease {
    height: 22px;
    font-size: .88rem;
    color: var(--pink);
    font-weight: 700;
    margin-bottom: 12px;
    opacity: 0;
    transition: opacity .3s;
  }
  .tease.show { opacity: 1; }
</style>
</head>
<body>

<!-- Floating bg hearts -->
<div class="bg-hearts" id="bgHearts"></div>

<!-- Card -->
<div class="card" id="card">

  <!-- Default view -->
  <div id="askView">
    <div class="bear-wrap">
      <span class="bear" id="bear">🐻</span>
      <span class="bear-blush left"></span>
      <span class="bear-blush right"></span>
    </div>

    <h1>Did You Love Me?</h1>
    <p class="sub">Be honest… the bear already knows 🐾</p>

    <div class="tease" id="tease"></div>

    <div class="btns" id="btns">
      <button class="btn btn-yes" onclick="sayYes()">Yes 💖</button>
      <button class="btn btn-no"  id="noBtn" onmouseover="runAway()" ontouchstart="runAway()">No 🙈</button>
    </div>
  </div>

  <!-- Yes view -->
  <div class="yes-screen" id="yesView">
    <span class="big-emoji">💘</span>
    <h2>I Knew It! 🐻</h2>
    <p>The bear is doing a happy dance right now…<br>and so is my heart. 💕</p>
  </div>

</div>

<script>
  /* ── Background floating hearts ── */
  const HEARTS = ['💗','💓','💖','💝','💞','🩷','❤️','💟'];
  const bg = document.getElementById('bgHearts');
  for (let i = 0; i < 28; i++) {
    const h = document.createElement('span');
    h.className = 'bh';
    h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
    h.style.left   = Math.random() * 100 + 'vw';
    h.style.bottom = '-5vh';
    h.style.animationDelay    = (Math.random() * 8) + 's';
    h.style.animationDuration = (4 + Math.random() * 5) + 's';
    h.style.fontSize = (.8 + Math.random() * 1.4) + 'rem';
    bg.appendChild(h);
  }

  /* ── No button runs away ── */
  let noCount = 0;
  const TEASES = [
    "Come on… really? 🥺",
    "Are you sure?? 💔",
    "The bear is crying… 😢",
    "Liar liar! 🙈",
    "Last chance! 💕",
    "Ok but you DO though 😏",
    "Just admit it… 🐻💖",
    "You can't escape love! 💘",
  ];

  function runAway() {
    noCount++;
    const noBtn = document.getElementById('noBtn');
    const card  = document.getElementById('card');
    const rect  = card.getBoundingClientRect();
    const bRect = noBtn.getBoundingClientRect();

    // Random offset ensuring the button stays inside the card
    const maxX = rect.width  - bRect.width  - 20;
    const maxY = rect.height - bRect.height - 20;
    const x = Math.max(10, Math.floor(Math.random() * maxX));
    const y = Math.max(10, Math.floor(Math.random() * maxY));

    noBtn.style.position = 'absolute';
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
    noBtn.style.margin = '0';

    // Make card relative if not already
    card.style.position = 'relative';
    const btns = document.getElementById('btns');
    btns.style.position = 'relative';
    btns.style.minHeight = '120px';

    // Tease text
    const tease = document.getElementById('tease');
    tease.textContent = TEASES[Math.min(noCount - 1, TEASES.length - 1)];
    tease.classList.add('show');

    // Grow Yes button slightly each time
    const yesBtn = document.querySelector('.btn-yes');
    const scale = Math.min(1 + noCount * 0.08, 1.6);
    yesBtn.style.transform = `scale(${scale})`;
  }

  /* ── Yes button ── */
  function sayYes() {
    document.getElementById('askView').style.display = 'none';
    const yv = document.getElementById('yesView');
    yv.style.display = 'block';
    spawnConfetti();
  }

  /* ── Confetti ── */
  const CONF_COLORS = ['#ff6b9d','#ff2d6b','#ffb3cc','#ff85a2','#fff','#ffde59','#c0f','#6cf'];
  function spawnConfetti() {
    for (let i = 0; i < 130; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)];
        c.style.width  = (6 + Math.random() * 10) + 'px';
        c.style.height = (6 + Math.random() * 10) + 'px';
        c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        c.style.animationDuration = (1.8 + Math.random() * 2.5) + 's';
        c.style.animationDelay = '0s';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }, i * 18);
    }
  }
</script>
</body>
</html>
